version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: kiyim_kechak_db
    restart: always
    environment:
      POSTGRES_USER: erp_user
      POSTGRES_PASSWORD: erp_password
      POSTGRES_DB: kiyim_kechak_erp
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U erp_user -d kiyim_kechak_erp"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: kiyim_kechak_backend
    restart: always
    environment:
      PORT: 5000
      NODE_ENV: production
      # NOTE: Local (docker-compose) uchun ishlatiladi.
      # EC2 production’da DATABASE_URL ni env’idan override qiling.
      DATABASE_URL: ${DATABASE_URL:-postgresql://erp_user:erp_password@postgres:5432/kiyim_kechak_erp?sslmode=disable}
      JWT_SECRET: ${JWT_SECRET:-super_jwt_secret_key_123!}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-super_jwt_refresh_secret_key_123!}
      CLIENT_URL: http://localhost
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: kiyim_kechak_frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  pgdata:
